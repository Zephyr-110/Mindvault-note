# ============================================
# MindVault 一键部署配置
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================

services:

  # ─────────── 前端 + Nginx 反向代理 ───────────
  frontend:
    build: ./frontend
    container_name: mindvault-frontend
    restart: always
    depends_on:
      - mindvault-app
    ports:
      - "${FRONTEND_PORT:-80}:80"

  # ─────────── MySQL 8.0 数据库 ───────────
  mysql:
    image: mysql:8.0
    container_name: mindvault-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mindvault
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────── Redis 7 缓存 ───────────
  redis:
    image: redis:7-alpine
    container_name: mindvault-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────── Java 后端 ───────────
  mindvault-app:
    build: .
    container_name: mindvault-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mindvault?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_ACCESS_SECRET: ${OSS_ACCESS_SECRET}
      OSS_BUCKET: ${OSS_BUCKET:-mindvault-files}
      AI_PYTHON_URL: http://mindvault-ai:8000
      SPRING_PROFILES_ACTIVE: prod
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    ports:
      - "8082:8082"

  # ─────────── Python AI 服务 ───────────
  mindvault-ai:
    build: ./mindvault-ai-python
    container_name: mindvault-ai
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LLM_API_KEY: ${DASHSCRIPT_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      DASHSCOPE_API_KEY: ${DASHSCRIPT_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"

# ─────────── 数据持久化 ───────────
volumes:
  mysql_data:
  redis_data: